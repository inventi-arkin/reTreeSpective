  <style>
    /* Global Styles */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .fruit-pop { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    /* WEATHER ANIMATIONS */
    @keyframes rainfall {
      0% { transform: translate(0, -50px); opacity: 0; }
      10% { opacity: var(--drop-opacity, 1); }
      90% { opacity: var(--drop-opacity, 1); }
      100% { transform: translate(-150px, 600px); opacity: 0; }
    }
    .rain-drop {
      position: absolute;
      top: -50px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.7));
      width: 2px;
      height: 60px;
      animation: rainfall linear infinite;
      transform: rotate(15deg);
    }
    @keyframes lightning-flash {
      0%, 90% { opacity: 0; }
      92% { opacity: 0.7; }
      94% { opacity: 0; }
      95% { opacity: 0.9; }
      100% { opacity: 0; }
    }
    .lightning { animation: lightning-flash 7s infinite; }
    @keyframes wind-streak {
      0% { transform: translateX(120vw); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateX(-50vw); opacity: 0; }
    }
    .wind-streak {
      position: absolute;
      height: 2px;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      animation: wind-streak linear infinite;
    }

    /* BIRD ANIMATIONS */
    @keyframes fly-right {
      0% { transform: translate(-10vw, 10vh) scale(0.5); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translate(110vw, -15vh) scale(1); opacity: 0; }
    }
    .bird { position: absolute; animation: fly-right linear infinite; }
    
    /* IDLE ANIMATIONS */
    @keyframes idle-breathe {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.03) translateY(-1px); }
    }
    @keyframes idle-head {
      0%, 100% { transform: rotate(0deg) translate(0, 0); }
      33% { transform: rotate(-3deg) translate(-1px, 1px); }
      66% { transform: rotate(3deg) translate(1px, 1px); }
    }
    .anim-idle-breathe { animation: idle-breathe 3s ease-in-out infinite; transform-origin: bottom; }
    .anim-idle-head { animation: idle-head 6s ease-in-out infinite; transform-origin: bottom; }
    
    /* ANIME MEADOW STYLES */
    .meadow-bg { background: linear-gradient(to bottom, #87CEEB, #B0E0E6); }

    .tree-trunk { fill: #5D4037; }
    .tree-leaves { fill: #7CB342; }
    .tree-leaves-highlight { fill: #AED581; }
  </style>
</head>

    const TreeOfProgress = ({ goodCount, badCount }) => {

      const isRainy = netScore <= -2, isStormy = netScore <= -4;
      const grassFill = isStormy ? "#064e3b" : (isRainy ? "#14532d" : "url(#meadowGradient)");
      const seedFill = isStormy ? "#78350f" : "#d97706";
      const treesConfig = [{ threshold: 0, cx: 50, scale: 1 }, { threshold: 12, cx: 20, scale: 0.85 }, { threshold: 24, cx: 80, scale: 0.8 }, { threshold: 40, cx: 8, scale: 0.65 }, { threshold: 55, cx: 92, scale: 0.7 }, { threshold: 75, cx: 35, scale: 0.6 }, { threshold: 100, cx: 65, scale: 0.55 }];

    };

    const GardenerAvatar = ({ user, stars, totalGardeners, index, forceScale }) => {
      const isSpotlight = !!forceScale;
      let scale = 1, overlapMargin = 12;

            </div>
          </div>

          {!isSpotlight && <div className="absolute top-[100%] mt-1 flex flex-col items-center"><span className="text-[11px] font-bold text-stone-800 bg-white/95 px-2.5 py-0.5 rounded-full shadow-sm border">{user?.displayName?.split(' ')[0]}</span><div className="flex items-center text-[10px] text-yellow-700 font-bold bg-yellow-100 px-2 py-0.5 rounded-full shadow-sm mt-0.5 border border-yellow-300"><Star size={9} className="mr-1 fill-yellow-500 text-yellow-500"/> {stars}</div></div>}

    };

    // --- MAIN APP ---
    function App() {
      const [user, setUser] = useState(null), [loading, setLoading] = useState(true), [authError, setAuthError] = useState('');
      const [sprints, setSprints] = useState([]), [usersList, setUsersList] = useState([]), [feedbacks, setFeedbacks] = useState([]), [kudos, setKudos] = useState([]), [adminsList, setAdminsList] = useState([]);
      const [selectedSprintId, setSelectedSprintId] = useState(null), [newSprintName, setNewSprintName] = useState(''), [isCreatingSprint, setIsCreatingSprint] = useState(false);
      const [newFeedbackText, setNewFeedbackText] = useState(''), [newFeedbackType, setNewFeedbackType] = useState('good'), [newKudoStars, setNewKudoStars] = useState(5), [newKudoText, setNewKudoText] = useState('');
      const [filterAuthorId, setFilterAuthorId] = useState(''), [newKudoReceiver, setNewKudoReceiver] = useState(''), [isManagingParticipants, setIsManagingParticipants] = useState(false), [tempParticipants, setTempParticipants] = useState([]), [activeSection, setActiveSection] = useState('intro');

      // Admin check logic is now dynamic based on Firestore configuration
      const isAdmin = user?.email && (adminsList.includes(user.email));

      useEffect(() => {
        const initAuth = async () => { if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { try { await signInWithCustomToken(auth, __initial_auth_token); } catch(e){} }};
        initAuth();

        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        
        // Listen to Admin List (Dynamic Config)
        const adminsRef = collection(db, 'artifacts', appId, 'public', 'data', 'admin_config');
        const unsubAdmins = onSnapshot(adminsRef, (snapshot) => {

      const netScore = displayedGood.length - displayedBad.length;
      const isWindy = netScore < 0, isRainy = netScore <= -2, isStormy = netScore <= -4;
      const skyGrad = isStormy ? "from-slate-800 to-slate-600 bg-gradient-to-b" : isRainy ? "from-slate-500 to-slate-300 bg-gradient-to-b" : isWindy ? "from-slate-300 to-emerald-50 bg-gradient-to-b" : "meadow-bg";

      const deleteItem = async (col, id) => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', col, id)); };
      const createSprint = async (e) => { e.preventDefault(); const dr = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'sprints'), { name: newSprintName, createdAt: Date.now(), createdBy: user.uid, participants: [user.uid] }); setNewSprintName(''); setIsCreatingSprint(false); setSelectedSprintId(dr.id); };
      const saveParticipants = async () => { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sprints', selectedSprintId), { participants: [...new Set([...tempParticipants, activeSprint.createdBy])] }); setIsManagingParticipants(false); };
      const scrollToSection = (i) => highlightContainerRef.current?.scrollTo({ top: highlightContainerRef.current.clientHeight * i, behavior: 'smooth' });

      if (loading) return <div className="min-h-screen bg-stone-50 flex items-center justify-center"><Loader2 className="animate-spin text-emerald-600" size={48} /></div>;
      if (!user) return (
        <div className="min-h-screen bg-stone-50 flex items-center justify-center p-6"><div className="w-full max-w-md bg-white rounded-2xl shadow-sm border p-10 text-center"><div className="bg-emerald-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6"><TreePine size={40} className="text-emerald-600" /></div><h2 className="text-2xl font-bold mb-2">ReTreeSpective</h2><p className="text-stone-500 mb-6">Sign in with your company email.</p><button onClick={handleGoogleLogin} className="w-full bg-white border px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-3 hover:bg-stone-50 shadow-sm transition-all">Sign in with Google</button>{authError && <p className="mt-4 text-red-500 text-sm">{authError}</p>}</div></div>
      );

      const gardeners = activeGardenersList.map(u => ({ ...u, stars: sprintKudos.filter(k => k.toUserId === u.uid).reduce((sum, k) => sum + k.stars, 0) }));

      return (
        <div className="min-h-screen bg-stone-50 flex flex-col text-stone-800">
          <header className="bg-emerald-800 text-white px-6 py-4 shadow-md sticky top-0 z-20 flex justify-between items-center">
            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setFilterAuthorId('')}><TreePine size={24} className="text-emerald-300" /><h1 className="text-xl font-bold tracking-tight">ReTreeSpective</h1></div>
            <div className="flex items-center space-x-4">
              <div className="hidden md:flex items-center space-x-3 pr-4 border-r border-emerald-700">
                {user.photoURL ? <img src={user.photoURL} className="w-8 h-8 rounded-full border border-emerald-600" /> : <UserCircle size={28} />}
                <div className="flex flex-col"><span className="text-sm font-medium leading-tight">{user.displayName}</span>{isAdmin && <span className="text-[10px] text-yellow-300 font-bold uppercase">Admin</span>}</div>
              </div>
              <button onClick={() => signOut(auth)}><LogOut size={20} /></button>
            </div>
          </header>

          {isManagingParticipants && (
            <div className="fixed inset-0 bg-stone-900/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 max-h-[80vh] flex flex-col">
                <h2 className="text-xl font-bold mb-4 flex items-center gap-2 text-emerald-950"><Users size={20} /> Manage Team</h2>
                <div className="overflow-y-auto flex-1 border rounded-xl p-2 bg-stone-50 space-y-1">
                   {usersList.map(u => (
                     <label key={u.uid} className="flex items-center space-x-3 p-3 rounded-lg border border-transparent hover:bg-white hover:border-stone-200 cursor-pointer">
                       <input type="checkbox" checked={tempParticipants.includes(u.uid) || u.uid === activeSprint?.createdBy} disabled={u.uid === activeSprint?.createdBy} onChange={(e) => e.target.checked ? setTempParticipants([...tempParticipants, u.uid]) : setTempParticipants(tempParticipants.filter(id => id !== u.uid))} className="rounded text-emerald-600 w-4 h-4" />
                       {u.photoURL ? <img src={u.photoURL} className="w-8 h-8 rounded-full shadow-sm" /> : <UserCircle size={32} className="text-stone-400"/>}
                       <span className="text-sm font-semibold">{u.displayName}</span>
                     </label>
                   ))}
                </div>
                <div className="mt-6 flex justify-end gap-3"><button onClick={() => setIsManagingParticipants(false)} className="px-4 py-2 font-medium text-stone-500">Cancel</button><button onClick={saveParticipants} className="px-4 py-2 bg-emerald-600 text-white rounded-lg font-bold shadow-sm">Save Team</button></div>
              </div>
            </div>
          )}

          <div className="bg-white border-b px-6 py-3 shadow-sm sticky top-[72px] z-10 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center space-x-4">
              <span className="text-stone-500 font-medium text-sm">Sprint:</span>
              {isCreatingSprint ? (
                <form onSubmit={createSprint} className="flex gap-2"><input type="text" value={newSprintName} onChange={(e) => setNewSprintName(e.target.value)} placeholder="Sprint name..." className="border rounded-md px-3 py-1.5 text-sm" autoFocus /><button type="submit" className="bg-emerald-600 text-white px-3 py-1.5 rounded-md text-sm font-medium">Save</button></form>
              ) : (
                <div className="relative"><select disabled={isHighlightMode} value={selectedSprintId || ''} onChange={(e) => setSelectedSprintId(e.target.value)} className="appearance-none bg-stone-100 border text-stone-800 font-semibold py-1.5 pl-3 pr-8 rounded-md focus:outline-none min-w-[150px]">{sprints.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select><ChevronDown size={16} className="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-stone-500" /></div>
              )}
              {selectedSprintId && <><div className="w-px h-6 bg-stone-200 mx-1"></div><select value={filterAuthorId} onChange={(e) => { setFilterAuthorId(e.target.value); setActiveSection('intro'); }} className="bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold text-sm py-1.5 px-3 rounded-md outline-none"><option value="">All Team</option>{activeGardenersList.map(u => <option key={u.uid} value={u.uid}>{u.displayName}</option>)}</select></>}
            </div>
            <div className="flex space-x-2">
              {selectedSprintId && (activeSprint?.createdBy === user?.uid || isAdmin) && <button onClick={() => { setTempParticipants(activeSprint?.participants || []); setIsManagingParticipants(true); }} className="flex items-center space-x-1 text-sm font-medium text-blue-600 bg-blue-50 px-3 py-1.5 rounded-md"><Users size={16} /><span>Team</span></button>}
              <button onClick={() => setIsCreatingSprint(true)} className="flex items-center space-x-1 text-sm font-medium text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-md"><Plus size={16} /><span>New</span></button>
            </div>
          </div>

          <main className="flex-1 max-w-[1600px] w-full mx-auto p-4 md:p-8">
            {!selectedSprintId ? (
              <div className="bg-white rounded-xl border p-12 text-center mt-10 shadow-sm"><Sprout size={48} className="mx-auto text-emerald-300 mb-4" /><h3 className="text-xl font-bold mb-2 text-stone-800">No Sprint Available</h3><p className="text-stone-500 mb-6">Create a new sprint or ask an owner to add you.</p></div>
            ) : isHighlightMode ? (
              <div className="relative w-full h-[calc(100vh-160px)] rounded-[2.5rem] overflow-hidden shadow-2xl border bg-stone-100 flex flex-col lg:flex-row">
                <div className="absolute inset-0 z-0"><div className={`absolute inset-0 transition-colors duration-1000 ${skyGrad}`}><WeatherOverlay isWindy={isWindy} isRainy={isRainy} isStormy={isStormy} /><BirdFlock netScore={netScore} /><div className={`absolute w-32 h-32 rounded-full pointer-events-none transition-all duration-1000 ${sunCls}`}></div><div className="absolute bottom-0 left-0 w-full h-[85%] pointer-events-none flex items-end justify-center"><TreeOfProgress goodCount={displayedGood.length} badCount={displayedBad.length} /></div></div></div>
                <div className="relative w-full lg:w-5/12 h-[35vh] lg:h-full flex items-end justify-center pb-8 lg:pb-24 z-20 pointer-events-none order-2 lg:order-1"><div className="origin-bottom transform scale-[1.8] lg:scale-[3.2] pointer-events-auto"><GardenerAvatar user={spotlightUser} stars={spotlightStars} forceScale={true} /></div></div>
                <div className="absolute right-6 top-1/2 -translate-y-1/2 z-40 hidden lg:flex flex-col gap-4">{['intro', 'good', 'bad', 'kudos'].map((id, idx) => <button key={id} onClick={() => scrollToSection(idx)} className={`w-3 h-3 rounded-full transition-all border-2 ${activeSection === id ? 'bg-emerald-600 border-white scale-150 shadow-md' : 'bg-white/40 border-white/40'}`}></button>)}</div>
                <div ref={highlightContainerRef} onScroll={(e) => { const i = Math.round(e.target.scrollTop / e.target.clientHeight); setActiveSection(['intro', 'good', 'bad', 'kudos'][i]); }} className="flex-1 h-[65vh] lg:h-full z-30 overflow-y-auto snap-y snap-mandatory order-1 lg:order-2 [&::-webkit-scrollbar]:hidden">
                  <section className="h-full snap-start flex items-center justify-center p-6"><div className="bg-white/40 backdrop-blur-xl p-10 rounded-[3rem] border border-white shadow-2xl max-w-lg text-center"><h2 className="text-4xl font-black text-emerald-950">{spotlightUser?.displayName}'s Highlight</h2><p className="text-emerald-900 font-bold mt-4 text-xl">Reviewing garden growth this sprint.</p></div></section>
                  <section className="h-full snap-start flex flex-col p-6 lg:p-12"><div className="flex-1 bg-white/40 backdrop-blur-xl border border-white shadow-2xl rounded-[3rem] flex flex-col overflow-hidden"><div className="p-8 bg-emerald-500/20 border-b border-emerald-500/20 flex items-center gap-4"><Leaf size={32} className="text-emerald-700" /><h3 className="text-3xl font-black text-emerald-950 uppercase">Went Well</h3></div><div className="flex-1 overflow-y-auto p-8 space-y-6">{displayedGood.map(fb => <div key={fb.id} className="bg-white/80 p-6 rounded-3xl shadow-sm border border-emerald-100 relative group transition-transform hover:-translate-y-1"><p className="text-emerald-950 text-lg font-medium">{fb.text}</p>{(user.uid === fb.authorId || isAdmin) && <button onClick={() => deleteItem('feedbacks', fb.id)} className="absolute top-4 right-4 text-stone-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Trash2 size={20} /></button>}</div>)}</div></div></section>
                  <section className="h-full snap-start flex flex-col p-6 lg:p-12"><div className="flex-1 bg-white/40 backdrop-blur-xl border border-white shadow-2xl rounded-[3rem] flex flex-col overflow-hidden"><div className="p-8 bg-amber-500/20 border-b border-amber-500/20 flex items-center gap-4"><Wind size={32} className="text-amber-700" /><h3 className="text-3xl font-black text-amber-950 uppercase">To Improve</h3></div><div className="flex-1 overflow-y-auto p-8 space-y-6">{displayedBad.map(fb => <div key={fb.id} className="bg-white/80 p-6 rounded-3xl shadow-sm border border-amber-100 relative group transition-transform hover:-translate-y-1"><p className="text-amber-950 text-lg font-medium">{fb.text}</p>{(user.uid === fb.authorId || isAdmin) && <button onClick={() => deleteItem('feedbacks', fb.id)} className="absolute top-4 right-4 text-stone-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Trash2 size={20} /></button>}</div>)}</div></div></section>
                  <section className="h-full snap-start flex flex-col p-6 lg:p-12"><div className="flex-1 bg-white/40 backdrop-blur-xl border border-white shadow-2xl rounded-[3rem] flex flex-col overflow-hidden"><div className="p-8 bg-blue-500/20 border-b border-blue-500/20 flex items-center justify-between shrink-0"><div className="flex items-center gap-4"><Star size={32} className="text-blue-700 fill-blue-700" /><h3 className="text-3xl font-black text-blue-950 uppercase">Team Kudos</h3></div><div className="bg-blue-600 text-white px-5 py-2 rounded-2xl text-xl font-black shadow-lg">{spotlightStars} ★</div></div><div className="p-6 bg-white/20 border-b border-white/40"><form onSubmit={addKudo} className="flex gap-3"><input type="text" value={newKudoText} onChange={(e) => setNewKudoText(e.target.value)} placeholder="Say something nice..." className="flex-1 bg-white border border-blue-100 rounded-2xl px-6 py-4 text-lg font-medium outline-none" /><button type="submit" disabled={!newKudoText.trim()} className="bg-blue-600 text-white px-8 rounded-2xl font-black uppercase shadow-md">Send</button></form></div><div className="flex-1 overflow-y-auto p-8 space-y-6">{spotlightKudosList.map(k => <div key={k.id} className="bg-white/80 p-6 rounded-3xl shadow-sm flex justify-between items-start gap-6 relative group"><div><p className="text-blue-950 text-xl font-bold italic">"{k.text}"</p><p className="text-xs text-blue-800/60 mt-3 font-black uppercase">From {k.fromUserName}</p></div><div className="flex text-yellow-400 shrink-0">{[...Array(5)].map((_, i) => <Star key={i} size={20} className={i < k.stars ? "fill-current" : "text-stone-200"} />)}</div>{(user.uid === k.fromUserId || isAdmin) && <button onClick={() => deleteItem('kudos', k.id)} className="absolute top-4 right-4 text-stone-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Trash2 size={20} /></button>}</div>)}</div></div></section>
                </div>
              </div>
            ) : (
              <div className="flex flex-col gap-6 lg:gap-8 items-start w-full">
                <div className="w-full flex flex-col z-10 h-[350px] md:h-[450px]"><div className="bg-white/95 rounded-3xl shadow-md border p-4 flex flex-col h-full overflow-hidden"><div className="flex items-center justify-between mb-4 z-30 px-4"><h3 className="text-xl font-extrabold text-emerald-900 flex items-center gap-2"><TreePine className="text-emerald-600" /> Sprint Garden</h3><div className="flex items-center space-x-3 text-sm font-bold bg-white px-4 py-1.5 rounded-full shadow-sm"><span className="text-emerald-600 flex items-center gap-1"><Leaf size={14}/> {displayedGood.length}</span><div className="w-px h-3 bg-stone-300"></div><span className="text-amber-600 flex items-center gap-1"><Wind size={14}/> {displayedBad.length}</span></div></div><div className={`relative flex-1 w-full rounded-2xl overflow-hidden shadow-inner border transition-colors duration-1000 ${skyGrad}`}><WeatherOverlay isWindy={isWindy} isRainy={isRainy} isStormy={isStormy} /><BirdFlock netScore={netScore} /><div className={`absolute w-32 h-32 rounded-full pointer-events-none transition-all duration-1000 ${sunCls}`}></div><div className="absolute bottom-0 left-0 w-full h-[75%] pointer-events-none flex items-end justify-center"><TreeOfProgress goodCount={displayedGood.length} badCount={displayedBad.length} /></div><div className="absolute inset-0 z-20 overflow-x-auto overflow-y-hidden flex items-end"><div className="flex flex-nowrap items-end px-12 pb-12 mx-auto min-w-max h-full pt-10">{gardeners.sort((a,b) => b.stars - a.stars).map((g, idx) => <div key={g.uid} onClick={() => setFilterAuthorId(g.uid)}><GardenerAvatar user={g} stars={g.stars} totalGardeners={gardeners.length} index={idx} /></div>)}</div></div></div></div></div>
                <div className="w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="bg-emerald-50/50 rounded-3xl border flex flex-col h-[500px] shadow-sm"><div className="p-4 border-b bg-emerald-100/50 flex items-center gap-2 rounded-t-3xl"><Leaf size={20} className="text-emerald-600" /><h2 className="font-bold">Went Well</h2></div><div className="p-3 bg-white/60 border-b"><form onSubmit={addFeedback} className="flex gap-2"><input type="text" value={newFeedbackType === 'good' ? newFeedbackText : ''} onChange={(e) => { setNewFeedbackType('good'); setNewFeedbackText(e.target.value); }} placeholder="Add a win..." className="flex-1 bg-white border border-stone-100 rounded-xl px-3 py-2 text-sm outline-none" /><button type="submit" className="bg-emerald-600 text-white p-2 rounded-xl" disabled={newFeedbackType!=='good' || !newFeedbackText.trim()}><Plus size={20} /></button></form></div><div className="p-4 overflow-y-auto flex-1 space-y-3">{displayedGood.map(fb => <div key={fb.id} className="bg-white p-4 rounded-2xl shadow-sm border border-emerald-100 relative group"><p className="text-stone-800 text-sm whitespace-pre-wrap">{fb.text}</p><div className="mt-3 flex items-center space-x-2 text-xs text-stone-500">{fb.authorPhoto ? <img src={fb.authorPhoto} className="w-5 h-5 rounded-full" /> : <UserCircle size={20} />}<span>{fb.authorName}</span></div>{(user.uid === fb.authorId || isAdmin) && <button onClick={() => deleteItem('feedbacks', fb.id)} className="absolute top-3 right-3 text-stone-300 opacity-0 group-hover:opacity-100 transition-opacity"><Trash2 size={16} /></button>}</div>)}</div></div>
                  <div className="bg-amber-50/50 rounded-3xl border flex flex-col h-[500px] shadow-sm"><div className="p-4 border-b bg-amber-100/50 flex items-center gap-2 rounded-t-3xl"><Wind size={20} className="text-amber-600" /><h2 className="font-bold">To Improve</h2></div><div className="p-3 bg-white/60 border-b"><form onSubmit={addFeedback} className="flex gap-2"><input type="text" value={newFeedbackType === 'bad' ? newFeedbackText : ''} onChange={(e) => { setNewFeedbackType('bad'); setNewFeedbackText(e.target.value); }} placeholder="Add an obstacle..." className="flex-1 bg-white border rounded-lg px-3 py-2 text-sm outline-none" /><button type="submit" className="bg-amber-600 text-white p-2 rounded-lg disabled:opacity-50" disabled={newFeedbackType!=='bad' || !newFeedbackText.trim()}><Plus size={20} /></button></form></div><div className="p-4 overflow-y-auto flex-1 space-y-3">{displayedBad.map(fb => <div key={fb.id} className="bg-white p-4 rounded-2xl shadow-sm border border-amber-100 relative group"><p className="text-stone-800 text-sm whitespace-pre-wrap">{fb.text}</p><div className="mt-3 flex items-center space-x-2 text-xs text-stone-500">{fb.authorPhoto ? <img src={fb.authorPhoto} className="w-5 h-5 rounded-full" /> : <UserCircle size={20} />}<span>{fb.authorName}</span></div>{(user.uid === fb.authorId || isAdmin) && <button onClick={() => deleteItem('feedbacks', fb.id)} className="absolute top-3 right-3 text-stone-300 opacity-0 group-hover:opacity-100 transition-opacity"><Trash2 size={16} /></button>}</div>)}</div></div>
                  <div className="bg-blue-50/50 rounded-3xl border flex flex-col h-[500px] shadow-sm"><div className="p-4 border-b bg-blue-100/50 flex items-center gap-2 rounded-t-3xl"><Star size={20} className="text-blue-600 fill-blue-600" /><h2 className="font-bold">Team Kudos</h2></div><div className="p-3 bg-white/60 border-b"><form onSubmit={addKudo} className="space-y-2"><div className="flex gap-2"><select value={newKudoReceiver} onChange={(e) => setNewKudoReceiver(e.target.value)} className="flex-1 bg-white border border-stone-100 rounded-xl px-2 py-2 text-sm outline-none"><option value="">Select colleague...</option>{activeGardenersList.filter(u => u.uid !== user.uid).map(u => <option key={u.uid} value={u.uid}>{u.displayName}</option>)}</select><select value={newKudoStars} onChange={(e) => setNewKudoStars(Number(e.target.value))} className="w-16 bg-white border border-stone-100 rounded-xl px-2 py-2 text-sm outline-none">{[5,4,3,2,1].map(n => <option key={n} value={n}>{n} ★</option>)}</select></div><div className="flex gap-2"><input type="text" value={newKudoText} onChange={(e) => setNewKudoText(e.target.value)} placeholder="Say something nice..." className="flex-1 bg-white border border-stone-100 rounded-xl px-3 py-2 text-sm outline-none" /><button type="submit" disabled={!newKudoReceiver || !newKudoText.trim()} className="bg-blue-600 text-white p-2 rounded-xl"><Plus size={20} /></button></div></form></div><div className="p-4 overflow-y-auto flex-1 space-y-3">{sprintKudos.map(k => <div key={k.id} className="bg-white p-4 rounded-2xl shadow-sm border border-blue-100 relative group"><div className="flex justify-between items-center mb-2"><div className="flex items-center space-x-2">{k.toUserPhoto ? <img src={k.toUserPhoto} className="w-6 h-6 rounded-full" /> : <UserCircle size={24} />}<span className="font-bold text-sm">{k.toUserName}</span></div><div className="flex text-yellow-400">{[...Array(5)].map((_, i) => <Star key={i} size={14} className={i < k.stars ? "fill-current" : "text-stone-200"} />)}</div></div><p className="text-stone-600 text-sm italic">"{k.text}"</p><div className="mt-3 text-xs text-stone-400 pt-2 border-t">From: {k.fromUserName}</div>{(user.uid === k.fromUserId || isAdmin) && <button onClick={() => deleteItem('kudos', k.id)} className="absolute top-3 right-3 text-stone-300 opacity-0 group-hover:opacity-100 transition-opacity"><Trash2 size={16} /></button>}</div>)}</div></div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }
    const root = createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>
</html>
