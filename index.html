<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReTreeSpective</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel standalone to compile JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Import Maps to load React, Icons, and Firebase natively -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.294.0?external=react",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
  </script>

  <style>
    /* Global Styles */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .fruit-pop { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    /* WEATHER ANIMATIONS */
    @keyframes rainfall {
      0% { transform: translate(0, -50px); opacity: 0; }
      10% { opacity: var(--drop-opacity, 1); }
      90% { opacity: var(--drop-opacity, 1); }
      100% { transform: translate(-150px, 600px); opacity: 0; }
    }
    .rain-drop {
      position: absolute;
      top: -50px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.7));
      width: 2px;
      height: 60px;
      animation: rainfall linear infinite;
      transform: rotate(15deg);
    }
    @keyframes lightning-flash {
      0%, 90% { opacity: 0; }
      92% { opacity: 0.7; }
      94% { opacity: 0; }
      95% { opacity: 0.9; }
      100% { opacity: 0; }
    }
    .lightning {
      animation: lightning-flash 7s infinite;
    }
    @keyframes wind-streak {
      0% { transform: translateX(120vw); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateX(-50vw); opacity: 0; }
    }
    .wind-streak {
      position: absolute;
      height: 2px;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      animation: wind-streak linear infinite;
    }

    /* BIRD ANIMATIONS */
    @keyframes fly-right {
      0% { transform: translate(-10vw, 10vh) scale(0.5); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translate(110vw, -15vh) scale(1); opacity: 0; }
    }
    .bird {
      position: absolute;
      animation: fly-right linear infinite;
    }
  </style>
</head>
<body class="bg-stone-50">
  <div id="root"></div>

  <!-- Main Application Logic -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      TreePine, LayoutDashboard, Settings, UserCircle, Plus,
      Leaf, Menu, LogOut, Loader2, ChevronDown, Trash2,
      Star, Sprout, Wind, Crown, Users
    } from 'lucide-react';
    import { initializeApp } from 'firebase/app';
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, signInWithCustomToken } from 'firebase/auth';
    import { 
      getFirestore, collection, onSnapshot, addDoc, setDoc, doc, deleteDoc, updateDoc 
    } from 'firebase/firestore';

    // Your custom Firebase configuration
    const customFirebaseConfig = {
      apiKey: "AIzaSyAENhzftyzp2Hq9dxWHkXyOAFpBtJ-bYcA",
      authDomain: "retreespective.firebaseapp.com",
      projectId: "retreespective",
      storageBucket: "retreespective.firebasestorage.app",
      messagingSenderId: "1015414818833",
      appId: "1:1015414818833:web:d3e1e6630cc46d7d60c9b0",
      measurementId: "G-WXE20EK4DF"
    };

    // Detect if running inside the preview environment or on GitHub
    let firebaseConfig = customFirebaseConfig;
    let appId = 'retreespective-app';
    
    if (typeof __firebase_config !== 'undefined' && __firebase_config) {
      try {
        firebaseConfig = JSON.parse(__firebase_config);
      } catch (e) {
        console.warn("Failed to parse sandbox config, using custom config.");
      }
    }
    
    if (typeof __app_id !== 'undefined' && __app_id) {
      appId = __app_id;
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- VISUALIZATION COMPONENTS ---

    const BirdFlock = ({ netScore }) => {
      // Birds only appear if net score is 10 or higher
      if (netScore < 10) return null;
      
      const numBirds = Math.min(18, Math.floor((netScore - 5) / 2));
      const birds = useMemo(() => Array.from({ length: 18 }).map(() => ({
        top: `${Math.random() * 40 + 5}%`, // Keeps them in the upper half
        animationDuration: `${12 + Math.random() * 18}s`,
        animationDelay: `${Math.random() * 15}s`
      })), []);

      return (
        <div className="absolute inset-0 z-[22] pointer-events-none overflow-hidden">
          {birds.slice(0, numBirds).map((style, i) => (
            <svg key={`bird-${i}`} className="bird w-6 h-6 text-sky-900/60" style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
               <path d="M 2 12 Q 6 4 12 12 Q 18 4 22 12" />
            </svg>
          ))}
        </div>
      );
    };

    const WeatherOverlay = ({ isWindy, isRainy, isStormy }) => {
      if (!isWindy) return null;

      const dropsCount = isStormy ? 90 : (isRainy ? 35 : 0);
      const windStreaksCount = isStormy ? 15 : (isWindy ? 8 : 0);

      // Memoize the random values so they don't jitter when users type in input fields
      const drops = useMemo(() => Array.from({ length: 90 }).map(() => ({
        left: `${Math.random() * 150}%`,
        '--drop-opacity': Math.random() * 0.5 + 0.3,
        animationDuration: `${0.3 + Math.random() * 0.4}s`,
        animationDelay: `${Math.random() * 2}s`
      })), []);

      const streaks = useMemo(() => Array.from({ length: 15 }).map(() => ({
        top: `${Math.random() * 80}%`,
        width: `${50 + Math.random() * 200}px`,
        animationDuration: `${1 + Math.random() * 1.5}s`,
        animationDelay: `${Math.random() * 3}s`,
      })), []);

      return (
        <div className="absolute inset-0 z-[25] pointer-events-none overflow-hidden rounded-xl">
          {isStormy && <div className="absolute inset-0 bg-white mix-blend-overlay lightning"></div>}
          
          {isWindy && streaks.slice(0, windStreaksCount).map((style, i) => (
            <div key={`wind-${i}`} className="wind-streak" style={style}></div>
          ))}

          {(isRainy || isStormy) && drops.slice(0, dropsCount).map((style, i) => (
            <div key={`rain-${i}`} className="rain-drop" style={style}></div>
          ))}
        </div>
      );
    };

    const TreeOfProgress = ({ goodCount, badCount }) => {
      const netScore = goodCount - badCount;
      const isRainy = netScore <= -2;
      const isStormy = netScore <= -4;

      // Darken ground visually during storms
      const grassFill = isStormy ? "#064e3b" : (isRainy ? "#14532d" : "#22c55e");
      const dirtFill = isStormy ? "#451a03" : (isRainy ? "#78350f" : "#8B4513");
      const seedFill = isStormy ? "#78350f" : "#d97706";

      // Forest thresholds: Spawn new trees as score gets higher
      const treesConfig = [
        { threshold: 0, cx: 50, scale: 1 },        // Main Center Tree
        { threshold: 12, cx: 20, scale: 0.85 },    // Left Tree
        { threshold: 24, cx: 80, scale: 0.8 },     // Right Tree
        { threshold: 40, cx: 8, scale: 0.65 },     // Far Left Tree
        { threshold: 55, cx: 92, scale: 0.7 },     // Far Right Tree
        { threshold: 75, cx: 35, scale: 0.6 },     // Mid Left Tree
        { threshold: 100, cx: 65, scale: 0.55 },   // Mid Right Tree
      ];

      return (
        <div className="relative w-full h-full flex items-end justify-center drop-shadow-2xl">
          <svg viewBox="0 0 100 100" className="w-full h-full overflow-visible" preserveAspectRatio="xMidYMax meet">
            <path d="M -300 85 Q 50 65 400 85 L 400 120 L -300 120 Z" fill={dirtFill} opacity="0.6" className="transition-colors duration-1000" />
            <path d="M -300 88 Q 50 75 400 88 L 400 120 L -300 120 Z" fill={grassFill} opacity="0.9" className="transition-colors duration-1000" />

            {treesConfig.map((config, index) => {
              const localScore = netScore - config.threshold;
              
              // Only render auxiliary trees if they meet their threshold
              if (localScore < 0 && index !== 0) return null; 

              const effScore = Math.max(0, localScore);
              const trunkHeight = effScore === 0 ? 0 : Math.min(50, 10 + effScore * 4) * config.scale;
              const trunkWidth = effScore === 0 ? 0 : Math.min(16, 4 + effScore * 1.2) * config.scale;
              const canopySize = effScore === 0 ? 0 : Math.min(42, 12 + effScore * 3.5) * config.scale;
              const hasLeaves = effScore > 0;
              const fruitCount = Math.min(7, Math.max(0, effScore - 5)); 
              const cx = config.cx;

              const fruitPositions = [
                { x: cx, y: 80 - trunkHeight - canopySize * 0.7 },
                { x: cx - canopySize * 0.5, y: 80 - trunkHeight - canopySize * 0.2 },
                { x: cx + canopySize * 0.5, y: 80 - trunkHeight - canopySize * 0.2 },
                { x: cx - canopySize * 0.3, y: 80 - trunkHeight + canopySize * 0.3 },
                { x: cx + canopySize * 0.3, y: 80 - trunkHeight + canopySize * 0.3 },
                { x: cx - canopySize * 0.1, y: 80 - trunkHeight - canopySize * 0.5 },
                { x: cx + canopySize * 0.15, y: 80 - trunkHeight - canopySize * 0.6 },
              ];

              return (
                <g key={`tree-${index}`}>
                  {/* The Seed (Visible when main score is 0 or negative) */}
                  {index === 0 && effScore === 0 && (
                    <>
                      <ellipse cx={cx} cy="85" rx={5} ry={3} fill={seedFill} className="transition-all duration-1000 ease-in-out" />
                      <path d={`M ${cx} 85 Q ${cx+5} 80 ${cx+8} 75 Q ${cx+3} 78 ${cx} 85 Z`} fill="#16a34a" style={{ opacity: !isStormy ? 1 : 0, transition: 'all 1s ease-in-out' }} />
                    </>
                  )}

                  <rect
                    x={cx - trunkWidth / 2} y={85 - trunkHeight} width={trunkWidth} height={trunkHeight}
                    fill="#78350f" rx={2 * config.scale} className="transition-all duration-1000 ease-out" style={{ transformOrigin: `${cx}px 85px` }}
                  />

                  {hasLeaves && (
                    <g className="transition-all duration-1000 ease-out" style={{ transformOrigin: `${cx}px ${85 - trunkHeight}px` }}>
                      <circle cx={cx} cy={85 - trunkHeight - canopySize * 0.3} r={canopySize} fill="#16a34a" className="transition-all duration-1000 ease-out" />
                      <circle cx={cx - canopySize * 0.6} cy={85 - trunkHeight} r={canopySize * 0.7} fill="#15803d" className="transition-all duration-1000 ease-out" style={{ opacity: effScore >= 3 ? 1 : 0 }} />
                      <circle cx={cx + canopySize * 0.6} cy={85 - trunkHeight} r={canopySize * 0.7} fill="#15803d" className="transition-all duration-1000 ease-out" style={{ opacity: effScore >= 3 ? 1 : 0 }} />
                    </g>
                  )}

                  {fruitCount > 0 && Array.from({ length: fruitCount }).map((_, i) => (
                    <circle
                      key={`fruit-${index}-${i}-${effScore}`} 
                      cx={fruitPositions[i].x} cy={fruitPositions[i].y} r={4 * config.scale} fill="#ef4444" className="fruit-pop drop-shadow-sm"
                      style={{ transformOrigin: `${fruitPositions[i].x}px ${fruitPositions[i].y}px`, animationDelay: `${i * 150}ms` }}
                    />
                  ))}
                </g>
              );
            })}
          </svg>
        </div>
      );
    };

    const GardenerAvatar = ({ user, stars, totalGardeners, index }) => {
      const level = Math.floor(stars / 3); 
      
      // Compactness and overlap calculation based on crowd size
      let scale = 1;
      let overlapMargin = 8; // Standard margin gap
      
      if (totalGardeners >= 15) {
        scale = 0.65;
        overlapMargin = -12; // Heavy overlap for large teams
      } else if (totalGardeners >= 10) {
        scale = 0.8;
        overlapMargin = -4; // Slight overlap
      } else if (totalGardeners >= 6) {
        scale = 0.9;
        overlapMargin = 4;
      }

      const zIndex = 100 - (index || 0);

      return (
        <div 
          className="relative flex flex-col items-center group cursor-pointer origin-bottom transition-all duration-700 hover:!z-[999]"
          style={{ transform: `scale(${scale})`, margin: `0 ${overlapMargin}px`, zIndex }}
        >
          <div className="w-20 mb-8 relative flex flex-col items-center">
            <div className={`relative flex flex-col items-center transition-all duration-500 ease-out transform group-hover:-translate-y-2 group-hover:scale-110 z-20 ${level >= 4 ? 'drop-shadow-[0_0_15px_rgba(250,204,21,0.6)]' : ''}`}>
              
              <div className="absolute -top-5 z-30 transition-all duration-700 animate-bounce" style={{ opacity: level >= 3 ? 1 : 0, transform: `scale(${level >= 3 ? 1 : 0})` }}>
                <Crown size={20} className="text-yellow-400 fill-yellow-400 drop-shadow-md" />
              </div>

              <div className="absolute -top-2 z-20 transition-all duration-700 origin-bottom" style={{ opacity: level >= 1 && level < 3 ? 1 : 0, transform: `scale(${level >= 1 && level < 3 ? 1 : 0.5})` }}>
                <svg width="46" height="20" viewBox="0 0 100 50" className="drop-shadow-sm">
                  <ellipse cx="50" cy="40" rx="45" ry="10" fill="#d97706" />
                  <path d="M 25 40 Q 50 -10 75 40 Z" fill="#b45309" />
                </svg>
              </div>

              <div className={`relative w-10 h-10 rounded-full flex items-center justify-center bg-white z-10 border-[2px] shadow-sm ${level >= 4 ? 'border-yellow-400' : 'border-stone-200'}`}>
                {user.photoURL ? (
                  <img src={user.photoURL} alt="" className="w-full h-full rounded-full object-cover" />
                ) : (
                  <UserCircle size={32} className="text-stone-300" />
                )}
              </div>

              <div className="relative -mt-2 z-0">
                <svg width="45" height="52" viewBox="0 0 50 60" className="drop-shadow-md">
                  <path d="M 15 15 Q 0 30 10 45" fill="none" stroke="#a7f3d0" strokeWidth="6" strokeLinecap="round" />
                  <path d={level >= 2 ? "M 35 15 Q 55 20 45 35" : "M 35 15 Q 50 30 40 45"} fill="none" stroke="#a7f3d0" strokeWidth="6" strokeLinecap="round" className="transition-all duration-500 ease-out"/>
                  <path d="M 20 35 L 18 55 M 30 35 L 32 55" fill="none" stroke="#1e3a8a" strokeWidth="6" strokeLinecap="round" />
                  <path d="M 14 55 h 6 v 4 h -6 z M 30 55 h 6 v 4 h -6 z" fill="#78350f" />
                  <rect x="13" y="10" width="24" height="25" rx="8" fill={level >= 3 ? "#fef08a" : "#a7f3d0"} className="transition-colors duration-1000" />
                  <path d="M 15 22 h 20 v 10 a 10 10 0 0 1 -10 10 a 10 10 0 0 1 -10 -10 z" fill="#3b82f6" />
                  <rect x="17" y="10" width="3" height="12" fill="#2563eb" />
                  <rect x="30" y="10" width="3" height="12" fill="#2563eb" />
                </svg>

                <div className="absolute top-4 -right-2 w-6 h-6 bg-emerald-100 rounded-full border border-white flex items-center justify-center transition-all duration-700 z-30 shadow-md" style={{ opacity: level >= 2 ? 1 : 0, transform: `scale(${level >= 2 ? 1 : 0}) rotate(15deg)` }}>
                  <Sprout size={12} className="text-emerald-600" />
                </div>
              </div>
              
              <div className="absolute -bottom-1 left-1/2 -translate-x-1/2 w-8 h-2 bg-emerald-900/20 rounded-full blur-[2px] z-[-1] transition-all duration-500 group-hover:w-6 group-hover:opacity-30"></div>
            </div>
            
            <div className="absolute -bottom-8 flex flex-col items-center transition-all duration-500 opacity-80 group-hover:opacity-100 group-hover:translate-y-1 z-30 pointer-events-none">
              <span className="text-[10px] font-bold text-stone-800 tracking-wide bg-white/95 px-2 py-0.5 rounded-full shadow-sm border border-stone-200 whitespace-nowrap">
                {user.displayName?.split(' ')[0]}
              </span>
              <div className="flex items-center text-[9px] text-yellow-700 font-bold bg-yellow-100 px-1.5 py-0.5 rounded-full shadow-sm mt-0.5 border border-yellow-300">
                <Star size={8} className="mr-1 fill-yellow-500 text-yellow-500"/> {stars}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- MAIN APPLICATION COMPONENT ---
    function App() {
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [authError, setAuthError] = useState('');

      const [sprints, setSprints] = useState([]);
      const [usersList, setUsersList] = useState([]);
      const [feedbacks, setFeedbacks] = useState([]);
      const [kudos, setKudos] = useState([]);
      
      const [selectedSprintId, setSelectedSprintId] = useState(null);
      const [newSprintName, setNewSprintName] = useState('');
      const [isCreatingSprint, setIsCreatingSprint] = useState(false);

      const [newFeedbackText, setNewFeedbackText] = useState('');
      const [newFeedbackType, setNewFeedbackType] = useState('good');
      
      const [newKudoReceiver, setNewKudoReceiver] = useState('');
      const [newKudoStars, setNewKudoStars] = useState(5);
      const [newKudoText, setNewKudoText] = useState('');
      
      const [filterAuthorId, setFilterAuthorId] = useState('');
      const [isManagingParticipants, setIsManagingParticipants] = useState(false);
      const [tempParticipants, setTempParticipants] = useState([]);

      useEffect(() => {
        const initAuth = async () => {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            try {
              await signInWithCustomToken(auth, __initial_auth_token);
            } catch (err) {
              console.error("Custom token auth failed", err);
            }
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
          setUser(currentUser);
          setLoading(false);
          
          if (currentUser) {
            try {
              const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.uid);
              await setDoc(userRef, {
                uid: currentUser.uid,
                displayName: currentUser.displayName || currentUser.email?.split('@')[0] || 'User',
                photoURL: currentUser.photoURL || ''
              }, { merge: true });
            } catch (err) {
              console.error("Error saving user profile:", err);
            }
          }
        });

        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;

        const sprintsRef = collection(db, 'artifacts', appId, 'public', 'data', 'sprints');
        const unsubSprints = onSnapshot(sprintsRef, (snapshot) => {
          const sprintsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          sprintsData.sort((a, b) => b.createdAt - a.createdAt);
          setSprints(sprintsData);
          if (sprintsData.length > 0 && !selectedSprintId) {
            setSelectedSprintId(sprintsData[0].id);
          }
        }, (err) => console.error(err));

        const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'users');
        const unsubUsers = onSnapshot(usersRef, (snapshot) => {
          setUsersList(snapshot.docs.map(doc => doc.data()));
        }, (err) => console.error(err));

        const feedbacksRef = collection(db, 'artifacts', appId, 'public', 'data', 'feedbacks');
        const unsubFeedbacks = onSnapshot(feedbacksRef, (snapshot) => {
          setFeedbacks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        }, (err) => console.error(err));

        const kudosRef = collection(db, 'artifacts', appId, 'public', 'data', 'kudos');
        const unsubKudos = onSnapshot(kudosRef, (snapshot) => {
          setKudos(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        }, (err) => console.error(err));

        return () => { unsubSprints(); unsubUsers(); unsubFeedbacks(); unsubKudos(); };
      }, [user, selectedSprintId]);

      const currentFeedbacks = feedbacks.filter(f => f.sprintId === selectedSprintId);
      const totalGoodFeedbacks = currentFeedbacks.filter(f => f.type === 'good');
      const totalBadFeedbacks = currentFeedbacks.filter(f => f.type === 'bad');
      
      const displayedGoodFeedbacks = filterAuthorId ? totalGoodFeedbacks.filter(f => f.authorId === filterAuthorId) : totalGoodFeedbacks;
      const displayedBadFeedbacks = filterAuthorId ? totalBadFeedbacks.filter(f => f.authorId === filterAuthorId) : totalBadFeedbacks;

      const currentKudos = kudos.filter(k => k.sprintId === selectedSprintId);
      const activeSprint = sprints.find(s => s.id === selectedSprintId);
      
      // Sprint Participant Filtering
      const activeParticipantIds = activeSprint?.participants || [];
      const activeGardenersList = usersList.filter(u => activeParticipantIds.includes(u.uid));
      
      const gardeners = activeGardenersList.map(u => {
        const userKudos = currentKudos.filter(k => k.toUserId === u.uid);
        const totalStars = userKudos.reduce((sum, k) => sum + k.stars, 0);
        return { ...u, stars: totalStars };
      });

      // Compute Weather State Based on Net Score
      const netScore = totalGoodFeedbacks.length - totalBadFeedbacks.length;
      const isWindy = netScore < 0;
      const isRainy = netScore <= -2;
      const isStormy = netScore <= -4;

      let skyGradient = "from-sky-200 via-sky-100 to-emerald-50";
      if (isStormy) skyGradient = "from-slate-800 via-slate-700 to-slate-600";
      else if (isRainy) skyGradient = "from-slate-500 via-slate-400 to-slate-300";
      else if (isWindy) skyGradient = "from-slate-300 via-slate-200 to-emerald-50";

      // Dynamic Sun Logic based on Net Score
      let sunClass = "bg-yellow-100 w-16 h-16 top-10 left-10 opacity-80 blur-xl scale-100";
      if (netScore <= -3) {
        sunClass = "bg-orange-600 w-16 h-16 top-48 left-10 opacity-0 blur-2xl translate-y-10 scale-50"; // Stormy/Gone
      } else if (netScore < 0) {
        sunClass = "bg-orange-400 w-24 h-24 top-28 left-10 opacity-60 blur-2xl translate-y-5 scale-90"; // Setting
      } else if (netScore >= 20) {
        sunClass = "bg-yellow-50 w-32 h-32 top-2 left-12 opacity-100 blur-[20px] scale-125"; // Extremely bright
      } else if (netScore >= 10) {
        sunClass = "bg-yellow-50 w-24 h-24 top-6 left-10 opacity-95 blur-xl scale-110"; // Very bright
      }

      const handleGoogleLogin = async () => {
        setAuthError('');
        try { 
          const result = await signInWithPopup(auth, new GoogleAuthProvider()); 
          const email = result.user?.email || '';
          
          // Validate domain
          if (!(email.endsWith('@inventi.ph') || email.endsWith('@inventi.asia'))) {
            await signOut(auth); // Immediately sign them out
            setAuthError("Access denied. Only @inventi.ph or @inventi.asia email addresses are allowed.");
            return;
          }
        } 
        catch (error) { 
          console.error("Error signing in:", error); 
          if (error.code === 'auth/unauthorized-domain') {
            setAuthError("Domain not authorized. Please add this URL to your Firebase Console > Authentication > Settings > Authorized Domains.");
          } else {
            setAuthError(error.message);
          }
        }
      };

      const handleLogout = async () => {
        try { await signOut(auth); } 
        catch (error) { console.error("Error signing out:", error); }
      };

      const createSprint = async (e) => {
        e.preventDefault();
        if (!newSprintName.trim() || !user) return;
        try {
          const sprintsRef = collection(db, 'artifacts', appId, 'public', 'data', 'sprints');
          // Add the creator as the default first participant
          const docRef = await addDoc(sprintsRef, { name: newSprintName, createdAt: Date.now(), createdBy: user.uid, participants: [user.uid] });
          setNewSprintName(''); setIsCreatingSprint(false); setSelectedSprintId(docRef.id);
        } catch (err) { console.error(err); }
      };

      const saveParticipants = async () => {
        if (!selectedSprintId) return;
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'sprints', selectedSprintId);
          await updateDoc(docRef, { participants: tempParticipants });
          setIsManagingParticipants(false);
        } catch (err) { console.error("Error saving participants:", err); }
      };

      const addFeedback = async (e) => {
        e.preventDefault();
        if (!newFeedbackText.trim() || !selectedSprintId || !user) return;
        try {
          const feedbacksRef = collection(db, 'artifacts', appId, 'public', 'data', 'feedbacks');
          await addDoc(feedbacksRef, {
            sprintId: selectedSprintId, type: newFeedbackType, text: newFeedbackText,
            authorId: user.uid, authorName: user.displayName || user.email?.split('@')[0] || 'User', authorPhoto: user.photoURL || '', createdAt: Date.now()
          });
          setNewFeedbackText('');
        } catch (err) { console.error(err); }
      };

      const addKudo = async (e) => {
        e.preventDefault();
        if (!newKudoReceiver || !selectedSprintId || !user) return;
        const receiver = usersList.find(u => u.uid === newKudoReceiver);
        if (!receiver) return;
        try {
          const kudosRef = collection(db, 'artifacts', appId, 'public', 'data', 'kudos');
          await addDoc(kudosRef, {
            sprintId: selectedSprintId, fromUserId: user.uid, fromUserName: user.displayName || user.email?.split('@')[0] || 'User', fromUserPhoto: user.photoURL || '',
            toUserId: receiver.uid, toUserName: receiver.displayName, toUserPhoto: receiver.photoURL || '', stars: newKudoStars, text: newKudoText, createdAt: Date.now()
          });
          setNewKudoReceiver(''); setNewKudoText(''); setNewKudoStars(5);
        } catch (err) { console.error(err); }
      };

      const deleteItem = async (collectionName, id) => {
        if (!user) return;
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', collectionName, id);
          await deleteDoc(docRef);
        } catch (err) { console.error(err); }
      };

      if (loading) {
        return <div className="min-h-screen bg-stone-50 flex items-center justify-center text-stone-800"><Loader2 className="animate-spin text-emerald-600" size={48} /></div>;
      }

      if (!user) {
        return (
          <div className="min-h-screen bg-stone-50 flex flex-col items-center justify-center p-6 text-stone-800">
            <div className="w-full max-w-md bg-white rounded-2xl shadow-sm border border-stone-200 p-10 text-center">
              <div className="bg-emerald-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 border border-emerald-100 shadow-sm">
                <TreePine size={40} className="text-emerald-600" />
              </div>
              <h2 className="text-2xl font-bold text-stone-800 mb-2">ReTreeSpective</h2>
              <p className="text-stone-500 mb-6">Sign in to join your team's retro board.</p>
              
              <button onClick={handleGoogleLogin} className="w-full bg-white hover:bg-stone-50 text-stone-700 border border-stone-300 px-6 py-3 rounded-xl font-semibold transition-all duration-200 shadow-sm hover:shadow-md flex items-center justify-center space-x-3">
                <svg className="w-5 h-5" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                <span>Sign in with Google</span>
              </button>

              {authError && (
                <div className="mt-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl text-left">
                  <strong>Login Error:</strong> {authError}
                </div>
              )}

            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-stone-50 flex flex-col text-stone-800">
          {/* Header */}
          <header className="bg-emerald-800 text-emerald-50 px-6 py-4 shadow-md sticky top-0 z-20">
            <div className="max-w-[1600px] mx-auto flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer">
                <div className="bg-emerald-700 p-2 rounded-lg"><TreePine size={24} className="text-emerald-300" /></div>
                <h1 className="text-xl md:text-2xl font-bold tracking-tight hidden sm:block">ReTree<span className="text-emerald-300 font-medium">Spective</span></h1>
              </div>
              <div className="flex items-center space-x-4">
                <div className="hidden md:flex items-center space-x-3 pr-4 border-r border-emerald-700">
                  {user.photoURL ? <img src={user.photoURL} alt="Profile" className="w-8 h-8 rounded-full border-2 border-emerald-600 shadow-sm" /> : <UserCircle size={28} className="text-emerald-100" />}
                  <span className="text-sm font-medium">{user.displayName?.split(' ')[0]}</span>
                </div>
                <button onClick={handleLogout} className="text-emerald-200 hover:text-white p-1" title="Sign Out"><LogOut size={20} /></button>
              </div>
            </div>
          </header>

          {/* Manage Participants Modal */}
          {isManagingParticipants && (
            <div className="fixed inset-0 bg-stone-900/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 max-h-[80vh] flex flex-col">
                <h2 className="text-xl font-bold text-emerald-900 mb-2 flex items-center gap-2">
                  <Users size={20} className="text-emerald-600" /> Sprint Team
                </h2>
                <p className="text-sm text-stone-500 mb-4">Select the members participating in this sprint. They will appear in the Sprint Garden and Kudos lists.</p>
                
                <div className="overflow-y-auto flex-1 border border-stone-200 rounded-xl p-2 space-y-1 bg-stone-50">
                   {usersList.map(u => (
                     <label key={u.uid} className="flex items-center space-x-3 p-3 hover:bg-white rounded-lg cursor-pointer transition-colors border border-transparent hover:border-stone-200">
                       <input
                         type="checkbox"
                         checked={tempParticipants.includes(u.uid)}
                         onChange={(e) => {
                           if (e.target.checked) setTempParticipants([...tempParticipants, u.uid]);
                           else setTempParticipants(tempParticipants.filter(id => id !== u.uid));
                         }}
                         className="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 cursor-pointer"
                       />
                       {u.photoURL ? <img src={u.photoURL} className="w-8 h-8 rounded-full border border-stone-200" /> : <UserCircle size={32} className="text-stone-400"/>}
                       <span className="text-sm font-semibold text-stone-700">{u.displayName}</span>
                     </label>
                   ))}
                   {usersList.length === 0 && <p className="text-center text-stone-400 text-sm py-4">No registered users found.</p>}
                </div>
                
                <div className="mt-6 flex justify-end gap-3 pt-4 border-t border-stone-100">
                   <button onClick={() => setIsManagingParticipants(false)} className="px-4 py-2 font-medium text-stone-500 hover:text-stone-700 hover:bg-stone-100 rounded-lg transition-colors">Cancel</button>
                   <button onClick={saveParticipants} className="px-4 py-2 font-medium bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors shadow-sm">Save Team</button>
                </div>
              </div>
            </div>
          )}

          {/* Sprint Bar */}
          <div className="bg-white border-b border-stone-200 px-6 py-3 shadow-sm sticky top-[72px] z-10">
            <div className="max-w-[1600px] mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="flex items-center space-x-4">
                <span className="text-stone-500 font-medium text-sm sm:text-base">Current Sprint:</span>
                {isCreatingSprint ? (
                  <form onSubmit={createSprint} className="flex items-center space-x-2 w-full sm:w-auto">
                    <input type="text" value={newSprintName} onChange={(e) => setNewSprintName(e.target.value)} placeholder="e.g., Sprint 42" className="border border-stone-300 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 w-full sm:w-48" autoFocus />
                    <button type="submit" className="bg-emerald-600 text-white px-3 py-1.5 rounded-md text-sm font-medium hover:bg-emerald-700">Save</button>
                    <button type="button" onClick={() => setIsCreatingSprint(false)} className="text-stone-500 hover:text-stone-700 text-sm">Cancel</button>
                  </form>
                ) : (
                  <div className="relative group">
                    <select value={selectedSprintId || ''} onChange={(e) => setSelectedSprintId(e.target.value)} className="appearance-none bg-stone-100 border border-stone-200 text-stone-800 font-semibold py-1.5 pl-3 pr-8 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer min-w-[150px]">
                      {sprints.length === 0 && <option value="">No sprints yet</option>}
                      {sprints.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                    <ChevronDown size={16} className="absolute right-2 top-1/2 -translate-y-1/2 text-stone-500 pointer-events-none" />
                  </div>
                )}
                {!isCreatingSprint && selectedSprintId && (
                  <>
                    <div className="hidden sm:block w-px h-6 bg-stone-200 mx-1"></div>
                    <div className="flex items-center space-x-2">
                      <span className="text-stone-500 font-medium text-sm hidden sm:inline">Filter:</span>
                      <div className="relative group">
                        <select value={filterAuthorId} onChange={(e) => setFilterAuthorId(e.target.value)} className="appearance-none bg-white border border-stone-200 text-stone-600 text-sm py-1.5 pl-3 pr-8 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer w-[130px] sm:w-auto">
                          <option value="">All Authors</option>
                          {activeGardenersList.map(u => <option key={u.uid} value={u.uid}>{u.displayName?.split(' ')[0]}</option>)}
                        </select>
                        <ChevronDown size={14} className="absolute right-2 top-1/2 -translate-y-1/2 text-stone-400 pointer-events-none" />
                      </div>
                    </div>
                  </>
                )}
              </div>
              
              <div className="flex items-center space-x-2">
                {!isCreatingSprint && selectedSprintId && (
                  <button onClick={() => { setTempParticipants(activeSprint?.participants || []); setIsManagingParticipants(true); }} className="flex items-center space-x-1 text-sm font-medium text-blue-600 hover:text-blue-700 bg-blue-50 px-3 py-1.5 rounded-md w-fit transition-colors">
                    <Users size={16} /><span>Team</span>
                  </button>
                )}
                {!isCreatingSprint && (
                  <button onClick={() => setIsCreatingSprint(true)} className="flex items-center space-x-1 text-sm font-medium text-emerald-600 hover:text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-md w-fit transition-colors">
                    <Plus size={16} /><span>New Sprint</span>
                  </button>
                )}
              </div>
            </div>
          </div>

          <main className="flex-1 max-w-[1600px] w-full mx-auto p-4 md:p-6 lg:p-8">
            {!selectedSprintId ? (
              <div className="bg-white rounded-xl border border-stone-200 p-12 text-center mt-10 shadow-sm">
                <Sprout size={48} className="mx-auto text-emerald-300 mb-4" />
                <h3 className="text-xl font-bold text-stone-800 mb-2">No Sprint Selected</h3>
                <p className="text-stone-500 mb-6">Create a new sprint to start your retrospective.</p>
                <button onClick={() => setIsCreatingSprint(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-lg font-medium inline-flex items-center space-x-2">
                  <Plus size={18} /><span>Create First Sprint</span>
                </button>
              </div>
            ) : (
              <div className="flex flex-col gap-6 lg:gap-8 items-start w-full">
                
                {/* Visual Scene */}
                <div className="w-full flex flex-col z-10 h-[350px] md:h-[450px]">
                  <div className="bg-white/95 backdrop-blur-sm rounded-2xl shadow-sm border border-stone-200 p-4 relative flex flex-col h-full overflow-hidden">
                    <div className="flex items-center justify-between mb-4 z-30 relative px-2 shrink-0">
                      <h3 className="text-xl font-extrabold text-emerald-900 flex items-center gap-2"><TreePine className="text-emerald-600" size={24} />Sprint Garden</h3>
                      <div className="flex items-center space-x-3 text-sm font-bold bg-white px-3 py-1.5 rounded-full shadow-sm border border-stone-100">
                        <span className="text-emerald-600 flex items-center gap-1"><Plus size={14} strokeWidth={3}/> {totalGoodFeedbacks.length}</span>
                        <div className="w-px h-3 bg-stone-300"></div>
                        <span className="text-amber-600 flex items-center gap-1"><Wind size={14} strokeWidth={3}/> {totalBadFeedbacks.length}</span>
                      </div>
                    </div>
                    
                    {/* The Integrated 3D-like Scene With Dynamic Weather & Sun */}
                    <div className={`relative flex-1 w-full bg-gradient-to-b ${skyGradient} rounded-xl overflow-hidden shadow-inner border border-stone-200 transition-colors duration-1000`}>
                      
                      <WeatherOverlay isWindy={isWindy} isRainy={isRainy} isStormy={isStormy} />
                      <BirdFlock netScore={netScore} />

                      {/* The Dynamic Sun */}
                      <div className={`absolute rounded-full pointer-events-none transition-all duration-1000 ease-in-out ${sunClass}`}></div>
                      
                      <div className="absolute bottom-0 left-0 w-full h-[75%] z-10 pointer-events-none flex items-end justify-center">
                        <TreeOfProgress goodCount={totalGoodFeedbacks.length} badCount={totalBadFeedbacks.length} />
                      </div>
                      
                      {/* Horizontal scrolling row to ensure they are ALL perfectly grounded at items-end */}
                      <div className="absolute inset-0 z-20 overflow-x-auto overflow-y-hidden [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none] flex items-end pointer-events-auto cursor-grab active:cursor-grabbing">
                        <div className="flex flex-nowrap items-end px-12 pb-12 mx-auto min-w-max h-full pt-10">
                          {gardeners.sort((a,b) => b.stars - a.stars).map((g, idx) => (
                            <GardenerAvatar key={g.uid} user={g} stars={g.stars} totalGardeners={gardeners.length} index={idx} />
                          ))}
                          {gardeners.length === 0 && (
                            <div className="text-sky-800/60 text-sm font-medium mb-10 bg-white/50 px-4 py-2 rounded-full border border-white/60 shadow-sm pointer-events-none">
                              Awaiting the first gardener...
                            </div>
                          )}
                        </div>
                      </div>

                    </div>
                  </div>
                </div>

                {/* Columns */}
                <div className="w-full grid grid-cols-1 lg:grid-cols-3 gap-4 xl:gap-6">
                  
                  {/* Good Column */}
                  <div className="bg-emerald-50/50 rounded-2xl border border-emerald-100 flex flex-col h-[500px] lg:h-[600px] shadow-sm">
                    <div className="p-4 border-b border-emerald-100 bg-emerald-100/50 rounded-t-2xl flex items-center space-x-2 shrink-0">
                      <Leaf size={20} className="text-emerald-600" /><h2 className="font-bold text-emerald-900 text-lg">Went Well</h2>
                      <span className="ml-auto bg-emerald-200 text-emerald-800 text-xs font-bold px-2 py-1 rounded-full">{displayedGoodFeedbacks.length}</span>
                    </div>
                    <div className="p-3 bg-white/60 border-b border-emerald-100 shrink-0">
                      <form onSubmit={(e) => { setNewFeedbackType('good'); addFeedback(e); }} className="flex gap-2">
                        <input type="text" value={newFeedbackType === 'good' ? newFeedbackText : ''} onChange={(e) => { setNewFeedbackType('good'); setNewFeedbackText(e.target.value); }} placeholder="Add a win..." className="flex-1 bg-white border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-400" />
                        <button type="submit" disabled={newFeedbackType !== 'good' || !newFeedbackText.trim()} className="bg-emerald-600 text-white p-2 rounded-lg disabled:opacity-50"><Plus size={20} /></button>
                      </form>
                    </div>
                    <div className="p-4 overflow-y-auto flex-1 space-y-3">
                      {displayedGoodFeedbacks.map(fb => (
                        <div key={fb.id} className="bg-white p-4 rounded-xl shadow-sm border border-emerald-100 relative group">
                          <p className="text-stone-800 text-sm whitespace-pre-wrap">{fb.text}</p>
                          <div className="mt-3 flex items-center space-x-2 text-xs text-stone-500">
                            {fb.authorPhoto ? <img src={fb.authorPhoto} alt="" className="w-5 h-5 rounded-full" /> : <UserCircle size={20} />}
                            <span>{fb.authorName}</span>
                          </div>
                          {user.uid === fb.authorId && <button onClick={() => deleteItem('feedbacks', fb.id)} className="absolute top-3 right-3 text-stone-300 hover:text-red-500 opacity-0 group-hover:opacity-100"><Trash2 size={16} /></button>}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Bad Column */}
                  <div className="bg-amber-50/50 rounded-2xl border border-amber-100 flex flex-col h-[500px] lg:h-[600px] shadow-sm">
                    <div className="p-4 border-b border-amber-100 bg-amber-100/50 rounded-t-2xl flex items-center space-x-2 shrink-0">
                      <Wind size={20} className="text-amber-600" /><h2 className="font-bold text-amber-900 text-lg">To Improve</h2>
                      <span className="ml-auto bg-amber-200 text-amber-800 text-xs font-bold px-2 py-1 rounded-full">{displayedBadFeedbacks.length}</span>
                    </div>
                    <div className="p-3 bg-white/60 border-b border-amber-100 shrink-0">
                      <form onSubmit={(e) => { setNewFeedbackType('bad'); addFeedback(e); }} className="flex gap-2">
                        <input type="text" value={newFeedbackType === 'bad' ? newFeedbackText : ''} onChange={(e) => { setNewFeedbackType('bad'); setNewFeedbackText(e.target.value); }} placeholder="Add an obstacle..." className="flex-1 bg-white border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400" />
                        <button type="submit" disabled={newFeedbackType !== 'bad' || !newFeedbackText.trim()} className="bg-amber-600 text-white p-2 rounded-lg disabled:opacity-50"><Plus size={20} /></button>
                      </form>
                    </div>
                    <div className="p-4 overflow-y-auto flex-1 space-y-3">
                      {displayedBadFeedbacks.map(fb => (
                        <div key={fb.id} className="bg-white p-4 rounded-xl shadow-sm border border-amber-100 relative group">
                          <p className="text-stone-800 text-sm whitespace-pre-wrap">{fb.text}</p>
                          <div className="mt-3 flex items-center space-x-2 text-xs text-stone-500">
                            {fb.authorPhoto ? <img src={fb.authorPhoto} alt="" className="w-5 h-5 rounded-full" /> : <UserCircle size={20} />}
                            <span>{fb.authorName}</span>
                          </div>
                          {user.uid === fb.authorId && <button onClick={() => deleteItem('feedbacks', fb.id)} className="absolute top-3 right-3 text-stone-300 hover:text-red-500 opacity-0 group-hover:opacity-100"><Trash2 size={16} /></button>}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Kudos Column */}
                  <div className="bg-blue-50/50 rounded-2xl border border-blue-100 flex flex-col h-[500px] lg:h-[600px] shadow-sm">
                    <div className="p-4 border-b border-blue-100 bg-blue-100/50 rounded-t-2xl flex items-center space-x-2 shrink-0">
                      <Star size={20} className="text-blue-600 fill-blue-600" /><h2 className="font-bold text-blue-900 text-lg">Colleague Kudos</h2>
                      <span className="ml-auto bg-blue-200 text-blue-800 text-xs font-bold px-2 py-1 rounded-full">{currentKudos.length}</span>
                    </div>
                    <div className="p-3 bg-white/60 border-b border-blue-100 shrink-0">
                      <form onSubmit={addKudo} className="space-y-2">
                        <div className="flex gap-2">
                          <select value={newKudoReceiver} onChange={(e) => setNewKudoReceiver(e.target.value)} className="flex-1 bg-white border border-stone-200 rounded-lg px-2 py-2 text-sm focus:outline-none focus:border-blue-400" required>
                            <option value="">Select colleague...</option>
                            {activeGardenersList.filter(u => u.uid !== user.uid).map(u => <option key={u.uid} value={u.uid}>{u.displayName}</option>)}
                          </select>
                          <select value={newKudoStars} onChange={(e) => setNewKudoStars(Number(e.target.value))} className="w-16 bg-white border border-stone-200 rounded-lg px-2 py-2 text-sm focus:outline-none focus:border-blue-400">
                            {[5,4,3,2,1].map(n => <option key={n} value={n}>{n} ★</option>)}
                          </select>
                        </div>
                        <div className="flex gap-2">
                          <input type="text" value={newKudoText} onChange={(e) => setNewKudoText(e.target.value)} placeholder="Optional note..." className="flex-1 bg-white border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400" />
                          <button type="submit" disabled={!newKudoReceiver} className="bg-blue-600 text-white p-2 rounded-lg disabled:opacity-50"><Plus size={20} /></button>
                        </div>
                      </form>
                    </div>
                    <div className="p-4 overflow-y-auto flex-1 space-y-3">
                      {currentKudos.map(k => (
                        <div key={k.id} className="bg-white p-4 rounded-xl shadow-sm border border-blue-100 relative group">
                          <div className="flex items-center justify-between mb-2">
                            <div className="flex items-center space-x-2">
                              {k.toUserPhoto ? <img src={k.toUserPhoto} alt="" className="w-6 h-6 rounded-full ring-2 ring-blue-100" /> : <UserCircle size={24} className="text-blue-300" />}
                              <span className="font-bold text-stone-800 text-sm">{k.toUserName}</span>
                            </div>
                            <div className="flex text-yellow-400">{[...Array(5)].map((_, i) => <Star key={i} size={14} className={i < k.stars ? "fill-current" : "text-stone-200"} />)}</div>
                          </div>
                          {k.text && <p className="text-stone-600 text-sm mt-2 italic whitespace-pre-wrap">"{k.text}"</p>}
                          <div className="mt-3 text-xs text-stone-400 flex items-center space-x-1 border-t border-stone-100 pt-2"><span>From: {k.fromUserName}</span></div>
                          {user.uid === k.fromUserId && <button onClick={() => deleteItem('kudos', k.id)} className="absolute top-3 right-3 text-stone-300 hover:text-red-500 opacity-0 group-hover:opacity-100"><Trash2 size={16} /></button>}
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    // Mount the App
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
